<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Document</title>
    <style>
         html {
        box-sizing: border-box;
      }

      *,
      *::after,
      *::before {
        margin: 0;
        padding: 0;

      }

      h1 {
        padding: 15px;
      }

      body {
        background-color: #111;
        color: #fff;
      }
    </style>
</head>
<body>
    <h1>Second Documents</h1>
</body>
</html>
