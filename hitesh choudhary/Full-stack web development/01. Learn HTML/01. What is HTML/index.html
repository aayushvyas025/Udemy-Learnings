<!--* What is HTML ?  -->
<!--  
 - HTML is the basic building blocks of our web-pages which us to create and format our web documents  
 - HTML mainly develop to create documents of research papers for screen. 
 - HTML stands for `Hyper Text Markup Language` 
   --  HyperText: Refers to text that contains links (hyperlinks) connecting one web page or document to another.
   -- Markup Language: A language that uses tags to structure and describe content on a web page, such as headings, paragraphs, images, links, and lists.
 - HTML is not programming language it is Markup language which uses tags to structure and describe content and format our content. 

  What is tags  
   Tags are container which define structure and meaning of our web- documents for example if we want to write paragraph we use paragraph tag and or add heading we use heading tags etc. 
  
   Syntax of tags 
    We create our tags like this <HTML-TAG></HTML-TAG> or <HTML/>  
     They are also of two types 
      ->  Opening-Closing HTML Tag which have opening part <HTML> and Closing part </HTML> 
      ->  Sel-Closing Tag Which doesn't required Closing tag <HTML/> 
-->

// This DOCTYPE html is declaration for web-browser that we are starting html-5
document
<!doctype html>
<html lang="en">
  <!--  
 - This html tag which is the main or root tag our HTML Documents. This is the entry point of our html documentation all the tags are written inside this html tag. 
 - HTML tag consist of two main tags which is head and body tags  
 -->

  <head>
    <!-- 
     - Head tag is used to store information for our HTML Documents 
     - This head tag include meta tags which is used to store meta information of our document 
     - More information like title tag which render the title of our HTML document in browser tab 
     - Linking tags for link third-party documents, style-sheet and javascript also 
    - What ever the tags we include in head section was not render on screen or viewport mainly for kept information about we-pages. 
     -->
    <meta charset="UTF-8" />
    <!-- This meta tag for Characters Encoding in our HTML 5   -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This meta tag related to viewport how our documents are format in different-different devices screen -->
    <title>Introduction to HTML</title>
    <!-- title tag which render our html doc title in browser tab  -->
  </head>
  <body>
    <!-- 
      - Body tag is used to render all the visible content on the screen  
      - All the HTML documents we want to structure with the tags are kept inside this body tag so it will render on our string  
     -->

    <h1>This is The Example of Heading Level 1 Tag</h1>
  </body>
</html>
